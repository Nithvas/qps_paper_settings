<!-- ======================== SYLLABUS DRAWER ======================== -->
<div id="syllabusDrawer" class="fixed inset-0 z-50 hidden">
    <div class="drawer-backdrop absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="window.syllabusApp.closeDrawer()"></div>
    <div class="relative w-full max-w-xl h-full ml-auto bg-white shadow-2xl">
        <div class="flex flex-col h-full">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50/80">
                <div>
                    <h3 id="syllabus-drawer-title" class="text-lg font-bold text-slate-900">Add Syllabus</h3>
                    <p id="syllabus-drawer-subtitle" class="text-sm text-slate-500">Attach syllabus document to a course</p>
                </div>
                <button onclick="window.syllabusApp.closeDrawer()" class="p-2 hover:bg-slate-200 rounded-lg transition">
                    <i class="bi bi-x-lg text-slate-500"></i>
                </button>
            </div>
            <!-- Form -->
            <div class="flex-1 overflow-y-auto p-6">
                <form id="syllabusForm" enctype="multipart/form-data" method="post">
                    {% csrf_token %}
                    <input type="hidden" id="editSyllabusId" value="">

                    <!-- Course -->
                    <div class="mb-4">
                        <label for="drawerCourse" class="block text-sm font-bold text-slate-700">Course <span class="text-rose-500">*</span></label>
                        <select id="drawerCourse" name="course" required class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-2.5 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                            <option value="">Select a course</option>
                            {% for course in courses %}
                                <option value="{{ course.id }}">{{ course.course_code }} - {{ course.course_title }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- File Upload -->
                    <div class="mb-4">
                        <label for="drawerSyllabusFile" class="block text-sm font-bold text-slate-700">Syllabus File</label>
                        <input type="file" id="drawerSyllabusFile" name="syllabus_file" accept=".pdf,.doc,.docx,.txt" class="mt-1 w-full text-sm border border-slate-200 rounded-lg p-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <p class="mt-1 text-xs text-slate-400">Accepted: PDF, Word, TXT (max 10MB)</p>
                    </div>

                    <!-- Active Status -->
                    <div class="mb-4 flex items-center gap-3">
                        <input type="checkbox" id="drawerIsActive" name="is_active" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <label for="drawerIsActive" class="text-sm font-medium text-slate-700">Active</label>
                    </div>

                    <!-- Submit -->
                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                        <button type="button" onclick="window.syllabusApp.closeDrawer()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                        <button type="submit" class="px-6 py-2 bg-[#8b1e3f] text-white text-sm font-bold rounded-lg hover:bg-[#721833] transition">
                            <i class="bi bi-save"></i> Save Syllabus
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- ======================== SYLLABUS DELETE MODAL ======================== -->
<div id="syllabusDeleteDrawer" class="fixed inset-0 z-50 hidden">
    <div class="drawer-backdrop absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="window.syllabusApp.closeDeleteModal()"></div>
    <div class="relative w-full max-w-md mx-auto mt-20 bg-white rounded-2xl shadow-2xl">
        <div class="p-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                    <i class="bi bi-exclamation-triangle-fill text-red-600 text-xl"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Delete Syllabus</h3>
                    <p class="text-sm text-slate-500">This action cannot be undone.</p>
                </div>
            </div>
            <div class="mt-4">
                <p id="syllabusDeleteMessage" class="text-sm text-slate-700">
                    Are you sure you want to delete the syllabus for <strong class="text-rose-700" id="syllabusDeleteInfo"></strong>?
                </p>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="window.syllabusApp.closeDeleteModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                <button id="confirmSyllabusDeleteBtn" class="px-6 py-2 bg-red-600 text-white text-sm font-bold rounded-lg hover:bg-red-700 transition">
                    <i class="bi bi-trash3"></i> Delete
                </button>
            </div>
        </div>
    </div>
</div>
