{% load static %}

<div
    class="flex flex-col lg:flex-row lg:items-center lg:justify-between pb-6 border-b border-slate-200 gap-4"
>
    <div class="space-y-1">
        <h2 class="text-2xl font-black tracking-tight text-slate-900">
            Course Directory
        </h2>
        <p class="text-xs sm:text-sm font-medium text-slate-500">
            Centralized academic course inventory, curriculum mapping, and
            assessment framework.
        </p>
    </div>
    <div class="flex items-center gap-3 self-start lg:self-center">
        <button
            type="button"
            onclick="openCourseDrawer()"
            class="inline-flex items-center gap-2 px-5 py-3 bg-gradient-to-r bg-jmc-maroon text-white text-xs font-bold rounded-lg transition-all duration-150 tracking-wider uppercase"
        >
            <i class="bi bi-plus-circle-fill text-sm"></i>
            Create New Course
        </button>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-5">
    <!-- Export -->
    <a
        href="{% url 'course:course_export' %}"
        class="flex items-center justify-between p-5 bg-white border-l-4 border-l-emerald-500 border-y border-r border-slate-200/80 rounded-xl group"
    >
        <div>
            <span
                class="block text-[10px] font-bold text-emerald-600 uppercase"
            >
                Data Export Matrix
            </span>
            <span class="text-sm font-bold text-slate-800">
                Download Courses Excel (.xlsx)
            </span>
        </div>
        <div
            class="px-4 py-2.5 bg-emerald-50 text-emerald-600 rounded-lg group-hover:bg-emerald-600 group-hover:text-white"
        >
            <i class="bi bi-file-earmark-spreadsheet-fill text-lg"></i>
        </div>
    </a>
    <!-- Template -->
    <a
        href="{% url 'course:course_sample' %}"
        class="flex items-center justify-between p-5 bg-white border-l-4 border-l-orange-500 border-y border-r border-slate-200/80 rounded-xl group"
    >
        <div>
            <span class="block text-[10px] font-bold text-orange-600 uppercase">
                System Template
            </span>
            <span class="text-sm font-bold text-slate-800">
                Download Sample Course Structure
            </span>
        </div>
        <div
            class="px-4 py-2.5 bg-orange-50 text-orange-600 rounded-lg group-hover:bg-orange-600 group-hover:text-white"
        >
            <i class="bi bi-layout-text-sidebar-reverse text-lg"></i>
        </div>
    </a>
    <!-- Upload Form -->
    <form
        method="post"
        enctype="multipart/form-data"
        action="{% url 'course:course_upload' %}"
        class="relative flex items-center justify-between p-5 bg-white border-l-4 border-l-blue-500 border-y border-r border-slate-200/80 rounded-xl group"
    >
        {% csrf_token %}
        <div class="absolute inset-y-0 left-0 right-24 z-10 cursor-pointer">
            <input
                type="file"
                name="file"
                accept=".xlsx, .xls"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                required
                id="courseFileInput"
            />
        </div>
        <div class="space-y-1 min-w-0 pr-2">
            <span class="block text-[10px] font-bold text-blue-600 uppercase">
                Batch Import Engine
            </span>
            <span
                class="text-sm font-bold text-slate-800 truncate block"
                id="courseFileNameDisplay"
            >
                Upload Course Data File
            </span>
        </div>
        <button
            type="submit"
            id="courseUploadBtn"
            class="z-20 px-4 py-2.5 bg-blue-50 text-blue-600 rounded-lg transition-all disabled:opacity-60 disabled:cursor-not-allowed"
            disabled
        >
            <i
                id="courseActionIcon"
                class="bi bi-cloud-arrow-up-fill text-lg"
            ></i>
        </button>
    </form>
</div>
