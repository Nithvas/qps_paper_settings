<div class="space-y-6 w-full font-sans antialiased text-slate-600 mt-6">
    <div class="bg-white border border-slate-200/80 rounded-xl shadow-sm overflow-hidden w-full">
        <form method="get" action="" class="m-0 p-0" id="filterForm">
            <div class="p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-white">
                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Program Type :</label>
                    <select name="program_type" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Program Types</option>
                        {% for pt in filter_options.program_types %}
                        <option value="{{ pt }}" {% if pt == filters.program_type %}selected{% endif %}>{{ pt }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Degree :</label>
                    <select name="degree" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Degrees</option>
                        {% for deg in filter_options.degrees %}
                        <option value="{{ deg }}" {% if deg == filters.degree %}selected{% endif %}>{{ deg }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Branch :</label>
                    <select name="branch" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Branches</option>
                        {% for b in filter_options.branches %}
                        <option value="{{ b }}" {% if b == filters.branch %}selected{% endif %}>{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Branch Final :</label>
                    <select name="branch_final" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Branch Finals</option>
                        {% for bf in filter_options.branch_finals %}
                        <option value="{{ bf }}" {% if bf == filters.branch_final %}selected{% endif %}>{{ bf }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Course Category :</label>
                    <select name="course_category" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Categories</option>
                        {% for cc in filter_options.course_categories %}
                        <option value="{{ cc }}" {% if cc == filters.course_category %}selected{% endif %}>{{ cc }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Semester :</label>
                    <select name="semester" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Semesters</option>
                        {% for sem in filter_options.semesters %}
                        <option value="{{ sem }}" {% if sem == filters.semester %}selected{% endif %}>{{ sem }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Part :</label>
                    <select name="part" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Parts</option>
                        {% for p in filter_options.parts %}
                        <option value="{{ p }}" {% if p == filters.part %}selected{% endif %}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Examiner Type :</label>
                    <select name="examiner_type" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <option value="">All Examiner Types</option>
                        {% for et in filter_options.examiner_types %}
                        <option value="{{ et }}" {% if et == filters.examiner_type %}selected{% endif %}>{{ et }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="px-5 pb-5 flex flex-col sm:flex-row gap-4 justify-end">
                <a href="{% url 'courses:course_list' %}" id="resetFiltersBtn" class="px-4 py-2 bg-white text-slate-600 rounded-lg text-sm font-semibold border border-slate-200 shadow-sm inline-flex items-center gap-1.5 hover:bg-slate-50 transition">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset Filters
                </a>
                <button type="button" id="applyFiltersBtn" class="px-4 py-1.5 bg-[#8b1e3f] text-white rounded-lg text-sm font-semibold shadow-sm inline-flex items-center gap-1.5 hover:bg-[#721833] transition">
                    <i class="bi bi-funnel"></i> Apply Filters
                </button>
            </div>
        </form>
    </div>
</div>
