{% if courses.has_next %}
<div class="border-t border-slate-200 bg-slate-50/50 px-6 py-4 rounded-b-xl">
    <div class="flex flex-col items-center gap-4">
        <div class="text-center">
            <p class="text-xs text-slate-500">
                Showing {{ courses.start_index }} to {{ courses.end_index }} of {{ courses.paginator.count }} courses
            </p>
        </div>
        
        <button id="loadMoreBtn" data-next-page="{{ courses.next_page_number }}" 
                class="inline-flex items-center gap-2 px-6 py-2.5 bg-white border-2 border-[#8b1e3f] text-[#8b1e3f] rounded-lg text-sm font-bold hover:bg-[#8b1e3f] hover:text-white transition-all duration-200">
            <i class="bi bi-arrow-repeat"></i>
            Load More Courses
        </button>
        
        <a href="?page={{ courses.paginator.num_pages }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value|urlencode }}{% endif %}{% endfor %}" 
           class="text-xs text-slate-400 hover:text-[#8b1e3f] transition">
            Go to last page <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</div>
{% endif %}
