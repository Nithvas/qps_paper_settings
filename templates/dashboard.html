{% extends 'layout.html' %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

.dashboard-header{

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.75),
            rgba(255,255,255,.55)
        );

    backdrop-filter:blur(20px);

    border:
        1px solid rgba(255,255,255,.7);

    border-radius:24px;

    padding:22px;

    margin-bottom:28px;

    box-shadow:
        0 12px 24px rgba(184,92,106,0.10);

    position:relative;

    overflow:hidden;

}

.dashboard-header::before{

    content:'';

    position:absolute;

    width:180px;
    height:180px;

    background:
        radial-gradient(
            circle,
            rgba(217,139,149,.22),
            transparent 70%
        );

    top:-80px;
    right:-60px;

}

.dashboard-title-wrap{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    gap:16px;

}

.dashboard-icon{

    width:68px;
    height:68px;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #d98b95,
            #b85c6a
        );

    color:white;

    font-size:28px;

    box-shadow:
        0 10px 24px rgba(184,92,106,0.20);

}

.dashboard-text h1{

    margin:0;

    font-size:30px;

    font-weight:700;

    color:#7e2b3a;

    letter-spacing:.3px;

}

/* DASHBOARD CARDS */

.dashboard-card{

    background:
        rgba(255,255,255,.68);

    backdrop-filter:blur(18px);

    border:
        1px solid rgba(255,255,255,.7);

    border-radius:22px;

    padding:22px;

    height:100%;

    transition:.3s;

    box-shadow:
        0 10px 24px rgba(184,92,106,0.08);

    overflow:hidden;

    position:relative;

}

.dashboard-card::before{

    content:'';

    position:absolute;

    width:100px;
    height:100px;

    background:
        radial-gradient(
            circle,
            rgba(217,139,149,.15),
            transparent 70%
        );

    top:-40px;
    right:-40px;

}

.dashboard-card:hover{

    transform:
        translateY(-4px);

    box-shadow:
        0 18px 32px rgba(237, 146, 160, 0.14);

}

.dashboard-card-content{

    position:relative;

    z-index:2;

}

.card-label{

    color:#9b5d67;

    font-size:14px;

    font-weight:600;

    margin-bottom:8px;

}

.card-value{

    font-size:30px;

    font-weight:700;

    color:#7e2b3a;

    margin:0;

}

.card-icon{

    width:62px;
    height:62px;

    border-radius:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #d98b95,
            #b85c6a
        );

    color:white;

    font-size:24px;

    box-shadow:
        0 10px 22px rgba(184,92,106,0.18);

}

@media(max-width:768px){

    .dashboard-title-wrap{

        flex-direction:row;

    }

    .dashboard-text h1{

        font-size:24px;

    }

    .dashboard-icon{

        width:60px;
        height:60px;

        font-size:24px;

    }

    .card-value{

        font-size:24px;

    }

}

</style>

<!-- DASHBOARD HEADER -->

<div class="dashboard-header">

    <div class="dashboard-title-wrap">

        <div class="dashboard-icon">

            <i class="bi bi-grid-1x2-fill"></i>

        </div>

        <div class="dashboard-text">

            <h1>
                Dashboard
            </h1>

        </div>

    </div>

</div>

<!-- CARDS -->

<div class="row g-4">

    <div class="col-lg-3 col-md-6">

        <div class="dashboard-card">

            <div class="dashboard-card-content">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="card-label">
                            Total Staff
                        </div>

                        <h2 class="card-value">
                            250
                        </h2>

                    </div>

                    <div class="card-icon">

                        <i class="bi bi-people-fill"></i>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-3 col-md-6">

        <div class="dashboard-card">

            <div class="dashboard-card-content">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="card-label">
                            Departments
                        </div>

                        <h2 class="card-value">
                            15
                        </h2>

                    </div>

                    <div class="card-icon">

                        <i class="bi bi-building-fill"></i>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-3 col-md-6">

        <div class="dashboard-card">

            <div class="dashboard-card-content">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="card-label">
                            Courses
                        </div>

                        <h2 class="card-value">
                            48
                        </h2>

                    </div>

                    <div class="card-icon">

                        <i class="bi bi-book-fill"></i>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-3 col-md-6">

        <div class="dashboard-card">

            <div class="dashboard-card-content">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="card-label">
                            QPS Assigned
                        </div>

                        <h2 class="card-value">
                            180
                        </h2>

                    </div>

                    <div class="card-icon">

                        <i class="bi bi-diagram-3-fill"></i>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
