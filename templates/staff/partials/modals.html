{% load static %}

<!-- DRAWER (Add/Edit) -->
<div id="staffDrawer" class="fixed inset-0 z-50 hidden" aria-labelledby="drawer-title" role="dialog">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeDrawer()"></div>
    <div class="absolute inset-y-0 right-0 w-full max-w-xl bg-white shadow-2xl flex flex-col h-full overflow-hidden transform transition-transform duration-300">
        <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
            <div><h2 id="drawer-title" class="text-lg font-bold text-slate-900">Register New Staff</h2><p id="drawer-subtitle" class="text-xs text-slate-400 mt-0.5">Fields marked * are required</p></div>
            <button onclick="closeDrawer()" class="p-2 text-slate-400 hover:bg-slate-50 rounded-lg"><i class="bi bi-x-lg"></i></button>
        </div>
        <form id="staffForm" class="flex-1 overflow-y-auto p-6 space-y-8 bg-slate-50/50">
            {% csrf_token %}
            <input type="hidden" name="staff_id" id="editStaffId" value="">

            <!-- Personal Info -->
            <div class="bg-white p-5 rounded-xl border space-y-4">
                <div class="flex gap-2 border-b pb-2"><i class="bi bi-person-badge text-indigo-500"></i><h3 class="font-bold text-xs uppercase">Personal Information</h3></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Sl. No.</label><input type="text" name="slno" id="drawerSlno" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Staff ID <span class="text-rose-500">*</span></label><input type="text" name="staff_id" id="drawerStaffId" required class="w-full rounded-lg border px-3 py-2"></div>
                    <div class="sm:col-span-2"><label class="block text-[11px] font-bold uppercase mb-1.5">Full Name <span class="text-rose-500">*</span></label><input type="text" name="name" id="drawerName" required class="w-full rounded-lg border px-3 py-2"></div>
                    <div class="sm:col-span-2"><label class="block text-[11px] font-bold uppercase mb-1.5">Designation</label><input type="text" name="designation" id="drawerDesignation" class="w-full rounded-lg border px-3 py-2"></div>
                </div>
            </div>

            <!-- Employment -->
            <div class="bg-white p-5 rounded-xl border space-y-4">
                <div class="flex gap-2 border-b pb-2"><i class="bi bi-briefcase text-indigo-500"></i><h3 class="font-bold text-xs uppercase">Employment Details</h3></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Programme</label><input type="text" name="program" id="drawerProgram" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Department</label><input type="text" name="department" id="drawerDepartment" class="w-full rounded-lg border px-3 py-2"></div>
                    <div class="sm:col-span-2"><label class="block text-[11px] font-bold uppercase mb-1.5">College</label><input type="text" name="college" id="drawerCollege" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Date of Joining</label><input type="date" name="doj" id="drawerDoj" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Date of Relieving</label><input type="date" name="dor" id="drawerDor" class="w-full rounded-lg border px-3 py-2"></div>
                </div>
            </div>

            <!-- Contact & Location -->
            <div class="bg-white p-5 rounded-xl border space-y-4">
                <div class="flex gap-2 border-b pb-2"><i class="bi bi-geo-alt text-indigo-500"></i><h3 class="font-bold text-xs uppercase">Contact & Location</h3></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Phone</label><input type="tel" name="phone" id="drawerPhone" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Email</label><input type="email" name="email" id="drawerEmail" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">City</label><input type="text" name="city" id="drawerCity" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">District</label><input type="text" name="district" id="drawerDistrict" class="w-full rounded-lg border px-3 py-2"></div>
                </div>
            </div>

            <!-- Banking -->
            <div class="bg-white p-5 rounded-xl border space-y-4">
                <div class="flex gap-2 border-b pb-2"><i class="bi bi-bank text-indigo-500"></i><h3 class="font-bold text-xs uppercase">Banking Information</h3></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2"><label class="block text-[11px] font-bold uppercase mb-1.5">Bank Account No.</label><input type="text" name="bank_account" id="drawerBankAccount" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">Bank Name</label><input type="text" name="bank_name" id="drawerBankName" class="w-full rounded-lg border px-3 py-2"></div>
                    <div><label class="block text-[11px] font-bold uppercase mb-1.5">IFSC Code</label><input type="text" name="ifsc_code" id="drawerIfsc" class="w-full rounded-lg border px-3 py-2"></div>
                </div>
            </div>

            <!-- Remarks -->
            <div class="bg-white p-5 rounded-xl border space-y-4">
                <div class="flex gap-2 border-b pb-2"><i class="bi bi-chat-text text-indigo-500"></i><h3 class="font-bold text-xs uppercase">Remarks</h3></div>
                <textarea name="remark" id="drawerRemark" rows="3" class="w-full rounded-lg border px-3 py-2 resize-none"></textarea>
            </div>
        </form>
        <div class="p-4 border-t bg-white flex gap-3 shrink-0">
            <button onclick="closeDrawer()" class="flex-1 px-4 py-2.5 bg-white border rounded-xl">Cancel</button>
            <button type="submit" form="staffForm" class="flex-[2] px-4 py-2.5 bg-[#8b1e3f] text-white rounded-xl flex items-center justify-center gap-2"><i class="bi bi-save"></i> Save Staff Record</button>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div id="deleteModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog">
    <div class="flex items-end justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeDeleteModal()"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
        <div class="relative inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white border rounded-2xl sm:my-8 sm:align-middle sm:max-w-md sm:w-full sm:p-6">
            <div class="sm:flex sm:items-start">
                <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-xl bg-rose-50 border border-rose-100 text-rose-600"><i class="bi bi-exclamation-triangle-fill text-lg"></i></div>
                <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                    <h3 class="text-base font-black leading-6 text-slate-900">Confirm Deletion</h3>
                    <div class="mt-2"><p class="text-xs sm:text-sm font-medium text-slate-500" id="deleteModalMessage">Are you certain you want to purge this staff record? This cannot be undone.</p></div>
                </div>
            </div>
            <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse gap-2">
                <button id="confirmDeleteBtn" type="button" class="w-full sm:w-auto inline-flex justify-center px-4 py-2.5 bg-gradient-to-r from-rose-600 to-rose-700 text-white text-xs font-bold rounded-lg">Delete Record</button>
                <button onclick="closeDeleteModal()" class="mt-3 sm:mt-0 w-full sm:w-auto inline-flex justify-center px-4 py-2.5 bg-white border rounded-lg">Abort</button>
            </div>
        </div>
    </div>
</div>
