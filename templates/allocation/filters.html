<div class="bg-white border border-slate-200/80 rounded-xl shadow-sm overflow-hidden">
    <form method="get" action="" class="m-0 p-0" id="filterForm">
        <div class="p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-white">
            <div class="space-y-1.5">
                <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Academic Year</label>
                <select name="academic_year" id="filterAcademicYear" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    <option value="">All Years</option>
                    {% for year in academic_years %}
                        <option value="{{ year.id }}" {% if request.GET.academic_year == year.id|stringformat:"s" %}selected{% endif %}>
                            {{ year.academic_year }} - {{ year.get_semester_type_display }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="space-y-1.5">
                <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Status</label>
                <select name="status" id="filterStatus" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    <option value="">All Status</option>
                    <option value="PENDING" {% if request.GET.status == 'PENDING' %}selected{% endif %}>Pending</option>
                    <option value="ASSIGNED" {% if request.GET.status == 'ASSIGNED' %}selected{% endif %}>Assigned</option>
                    <option value="IN_PROGRESS" {% if request.GET.status == 'IN_PROGRESS' %}selected{% endif %}>In Progress</option>
                    <option value="SUBMITTED" {% if request.GET.status == 'SUBMITTED' %}selected{% endif %}>Submitted</option>
                    <option value="APPROVED" {% if request.GET.status == 'APPROVED' %}selected{% endif %}>Approved</option>
                    <option value="REJECTED" {% if request.GET.status == 'REJECTED' %}selected{% endif %}>Rejected</option>
                    <option value="COMPLETED" {% if request.GET.status == 'COMPLETED' %}selected{% endif %}>Completed</option>
                </select>
            </div>
            <div class="space-y-1.5">
                <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Course</label>
                <select name="course" id="filterCourse" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    <option value="">All Courses</option>
                    {% for course in courses %}
                        <option value="{{ course.id }}" {% if request.GET.course == course.id|stringformat:"s" %}selected{% endif %}>
                            {{ course.course_code }} - {{ course.course_title }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="space-y-1.5">
                <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">QP Setter</label>
                <select name="setter" id="filterSetter" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    <option value="">All Setters</option>
                    {% for staff in staff_members %}
                        <option value="{{ staff.id }}" {% if request.GET.setter == staff.id|stringformat:"s" %}selected{% endif %}>
                            {{ staff.name }} ({{ staff.staff_id }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="space-y-1.5">
                <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Checker</label>
                <select name="checker" id="filterChecker" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    <option value="">All Checkers</option>
                    {% for user in users %}
                        <option value="{{ user.id }}" {% if request.GET.checker == user.id|stringformat:"s" %}selected{% endif %}>
                            {{ user.get_full_name|default:user.username }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="space-y-1.5">
                <label class="text-[11px] font-semibold tracking-wide text-slate-500 uppercase">Due Date</label>
                <select name="due_date_filter" id="filterDueDate" class="filter-select w-full rounded-lg border border-slate-200 text-xs p-2 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    <option value="">All Dates</option>
                    <option value="overdue" {% if request.GET.due_date_filter == 'overdue' %}selected{% endif %}>Overdue</option>
                    <option value="today" {% if request.GET.due_date_filter == 'today' %}selected{% endif %}>Due Today</option>
                    <option value="this_week" {% if request.GET.due_date_filter == 'this_week' %}selected{% endif %}>Due This Week</option>
                    <option value="next_week" {% if request.GET.due_date_filter == 'next_week' %}selected{% endif %}>Due Next Week</option>
                </select>
            </div>
            <div class="space-y-1.5 flex items-end">
                <div class="flex gap-2 w-full">
                    <button type="button" id="applyFiltersBtn" class="flex-1 px-4 py-2 bg-[#8b1e3f] text-white rounded-lg text-sm font-semibold shadow-sm hover:bg-[#721833] transition">
                        <i class="bi bi-funnel"></i> Apply
                    </button>
                    <button type="button" id="resetFiltersBtn" class="px-4 py-2 bg-white text-slate-600 rounded-lg text-sm font-semibold border border-slate-200 shadow-sm hover:bg-slate-50 transition">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
