{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        QPS Management System
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --primary:#d98b95;
    --secondary:#b85c6a;

    --bg:#fff5f7;
    --bg2:#fdecef;

    --white:#ffffff;

    --text:#7e2b3a;
    --text-light:#9b5d67;

    --border:#f3d7dc;

    --shadow:
        0 15px 35px rgba(184,92,106,0.10);

}

body{

    font-family:'Outfit',sans-serif;

    background:
        linear-gradient(
            135deg,
            #b7f6e6 0%,
            #d1e9c6 40%,
            #cef7bf 100%
        );

    color:var(--text);

    overflow-x:hidden;

    position:relative;

}

/* BACKGROUND EFFECT */

body::before{

    content:'';

    position:fixed;

    width:320px;
    height:320px;

    background:#ffccd5;

    border-radius:50%;

    top:-100px;
    left:-80px;

    filter:blur(90px);

    opacity:.5;

    z-index:-1;

}

body::after{

    content:'';

    position:fixed;

    width:350px;
    height:350px;

    background:#f5b8c4;

    border-radius:50%;

    bottom:-120px;
    right:-100px;

    filter:blur(100px);

    opacity:.5;

    z-index:-1;

}

/* =========================
   SIDEBAR
========================= */

.sidebar{

    width:290px;

    height:100vh;

    position:fixed;

    left:0;
    top:0;

    background:
        rgba(255,255,255,.55);

    backdrop-filter:blur(20px);

    border-right:
        1px solid rgba(255,255,255,.7);

    padding:24px 18px;

    overflow-y:auto;

    z-index:1000;

    box-shadow:
        10px 0 35px rgba(184,92,106,0.08);

}

/* LOGO */

.logo-box{

    display:flex;

    align-items:center;

    gap:16px;

    margin-bottom:45px;

}

.logo-icon{

    width:64px;
    height:64px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #d98b95,
            #b85c6a
        );

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    font-size:26px;

    box-shadow:
        0 15px 30px rgba(184,92,106,0.20);

}

.logo-text h3{

    margin:0;

    font-size:28px;

    font-weight:700;

    color:#7e2b3a;

}

.logo-text span{

    color:#9b5d67;

    font-size:11px;

    letter-spacing:2px;

}

/* =========================
   MENU
========================= */

.menu-title{

    color:#b07a84;

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:2px;

    margin:
        28px 0 12px 10px;

}

.menu-item{

    display:flex;

    align-items:center;

    gap:15px;

    padding:15px 18px;

    border-radius:18px;

    text-decoration:none;

    color:#7e2b3a;

    margin-bottom:12px;

    transition:0.3s;

    font-size:15px;

    font-weight:500;

}

.menu-item i{

    font-size:20px;

}

.menu-item:hover{

    background:
        linear-gradient(
            135deg,
            #ffe5ea,
            #fff1f3
        );

    color:#b85c6a;

    transform:translateX(6px);

}

.active-menu{

    background:
        linear-gradient(
            135deg,
            #d98b95,
            #b85c6a
        );

    color:white;

    box-shadow:
        0 12px 24px rgba(184,92,106,0.22);

}

/* =========================
   MAIN CONTENT
========================= */

.main-content{

    margin-left:290px;

    min-height:100vh;

    padding:30px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:992px){

    .sidebar{

        width:100%;

        height:auto;

        position:relative;

    }

    .main-content{

        margin-left:0;

    }

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <!-- LOGO -->

    <div class="logo-box">

        <div class="logo-icon">

            <i class="bi bi-grid-1x2-fill"></i>

        </div>

        <div class="logo-text">

            <h3>QPS</h3>

            <span>
                MANAGEMENT SYSTEM
            </span>

        </div>

    </div>

    <!-- MENU -->

    <div class="menu-title">
        MAIN MENU
    </div>

    <a href="{% url 'dashboard' %}"
       class="menu-item active-menu">

        <i class="bi bi-grid-fill"></i>
        Dashboard

    </a>

    <a href="{% url 'staff:staff_list' %}"
       class="menu-item">

        <i class="bi bi-people-fill"></i>
        Staff Management

    </a>

    <a href="{% url 'course:course_list' %}"
       class="menu-item">

        <i class="bi bi-people-fill"></i>
        Course Management

    </a>

    <a href="#"
       class="menu-item">

        <i class="bi bi-journal-richtext"></i>
        Syllabus Management

    </a>

    <a href="#"
       class="menu-item">

        <i class="bi bi-diagram-3-fill"></i>
        QPS Allocation

    </a>

    <!-- SETTINGS -->

    <div class="menu-title">
        SETTINGS
    </div>

    <a href="#"
       class="menu-item">

        <i class="bi bi-person-plus-fill"></i>
        Create User

    </a>

    <a href="#"
       class="menu-item">

        <i class="bi bi-shield-lock-fill"></i>
        Password Change

    </a>

    <a href="#"
       class="menu-item">

        <i class="bi bi-box-arrow-right"></i>
        Logout

    </a>
      
</div>

<!-- MAIN CONTENT -->

<div class="main-content">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
